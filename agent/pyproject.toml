[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zydah"
version = "0.1.0"
description = "Evidential belief fusion for agent evaluation (Dempster-Shafer, Yager, Smets TBM)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hydra-core>=1.3",
    "numpy>=2",
    "polars>=1",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "sentence-transformers[graph]>=6.2.0",
]

[project.optional-dependencies]
dev = ["pytest"]
graph = [
    "torch>=2.15.0",
    "torch-geometric>=2.8.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zydah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
]
