[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zydah"
version = "0.1.0"
description = "Evidential belief fusion for agent evaluation (Dempster-Shafer, Yager, Smets TBM)"
requires-python = ">=3.10"
dependencies = ["hydra-core>=1.3", "numpy>=2", "polars>=1"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/zydah"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
